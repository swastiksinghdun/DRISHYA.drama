<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="links.css">
    <style>
        body{
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTykHBOPxPBygUKYAfbQuKyeRkG1a1RPfDI7tQAmq7wrg&s=10);
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            flexwrap: wrap;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .head {
            text-align: center;
            margin-top: 30px;
            color: white;
        }

        .links {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;    
            text-align: center;
            margin-top: 20px;
            height: 40vh;
        }

        .links ul {
            list-style-type: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
        }

        img {
            size: cover;
            margin: 0 100px;
            width: 200px;
            height: 200px;
        }

        img:hover {
            transform: scale(1.4);
            transition: transform 0.3s ease;
        }

        .imgedit1 {
            margin: 0 100px;
            width: 200px;
            height: 180px;
            border-radius: 40px;
        }

        .imgedit2{
            width: 280px;
            height: 180px;
        }

        .form {
            text-align: center;
            margin-top: 50px;
            color: white;
            height: 60vh;
        }
        label,input{
            font-size: 25px;
            fontcolor: gray;
        }

        input {
            width: 60%;
            height: 40px;
            margin-bottom: 20px;
            align-self: center;
        }
        textarea {
            font-size: 20px;
            width: 85%;
            height: 100px;
        }
        
        input,textarea{
            border-radius: 15px;
            background-color:rgb(224, 61, 61)

        }
        h2,h3 {
            margin-bottom: 40px;
            font-size: 44px;
            color: wheat;
        }

        .submit-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            textsize: 1em;
            border-radius: 5px;
            cursor: pointer;
            width: 25%;
        }

        @media (max-width: 908px) {
            *{
                flex-direction: column;
                margin: 30px;
            }

            .head {
                margin-bottom: 300px;
            }
            .form {
                margin-top: 200px;
            }
            img {
                margin: 20px 0;
            }
            .submit-button {
                width: 50%;
            }
        }
    </style>
</head>

<body>
    <section class="head">
        <h2>Follow us by clicking on the icons:</h2>
    </section>
    <section class="links">
        <ul>
            <li><a href="https://www.instagram.com/drishya_iitbhilai?igsi=ZXJ4ZWZkOTk1bGNi" target="_blank"><img src="insta.png" alt="Instagram Link"></a></li>
            <li><a href="https://www.facebook.com/drishyaiit/" target="_blank"><img src="facebook.png" alt="Facebook Link" class="imgedit1"></a></li>
            <li><a href="https://youtube.com/@drishya2023?si=XMyn7qJGb2Jibb4w" target="_blank"><img src="youtube.png" alt="YouTube Link" class="imgedit2"></a></li>
        </ul>
    </section>
    <section class="form">
        <h3>Contact Us:</h3>
        <form action="mailto:drishya.iitbhilai@gmail.com" method="post" enctype="text/plain">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
            <input type="submit" value="Send" class="submit-button">
        </form>
    </section>
</body>

</html>
